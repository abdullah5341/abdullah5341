<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Bloch sphere of the current qubit state, P(0) = 50%">
<style>text{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
@keyframes pulse{0%,100%{r:7}50%{r:10}}.tip{animation:pulse 1.6s ease-in-out infinite}</style>
<defs><radialGradient id="g" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".4"/><stop offset="1" stop-color="#140f38" stop-opacity=".9"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="320" height="320" rx="18" fill="#0d0b22"/>
<circle cx="160" cy="150" r="105" fill="url(#g)" stroke="#a78bfa" stroke-width="1.4"/>
<ellipse cx="160" cy="150" rx="105" ry="29.4" fill="none" stroke="#a78bfa" opacity=".5"/>
<line x1="160" y1="37" x2="160" y2="263" stroke="#8f86c9" stroke-dasharray="3 4"/>
<text x="160" y="31" fill="#e9e5ff" font-size="14" text-anchor="middle">|0⟩</text>
<text x="160" y="279" fill="#e9e5ff" font-size="14" text-anchor="middle">|1⟩</text>
<line x1="160" y1="150" x2="123.2" y2="173.1" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
<circle class="tip" cx="123.2" cy="173.1" r="7" fill="#67e8f9" filter="url(#glow)"/>
<circle cx="160" cy="150" r="3" fill="#e9e5ff"/>
<rect x="18" y="292" width="142.0" height="10" rx="5" fill="#a78bfa"/>
<rect x="160.0" y="292" width="142.0" height="10" rx="5" fill="#67e8f9"/>
<text x="18" y="286" fill="#c4b5fd" font-size="11">P|0⟩ 50%</text>
<text x="302" y="286" fill="#67e8f9" font-size="11" text-anchor="end">P|1⟩ 50%</text>
</svg>
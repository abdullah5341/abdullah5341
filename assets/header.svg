<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Abdullah Mahmood — software engineer, quantum ML researcher, educator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07061a"/>
      <stop offset="0.6" stop-color="#140f38"/>
      <stop offset="1" stop-color="#1e1150"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e1150" stop-opacity="0.05"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a78bfa" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .sans { font-family: 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif; }
    .wire { stroke:#6d5bd0; stroke-width:1.5; opacity:.75 }
    .gate { fill:#1b1446; stroke:#a78bfa; stroke-width:1.4; animation: gate 6s infinite; }
    .gl   { fill:#e9e5ff; font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central; }
    .ctrl { fill:#a78bfa; animation: gate 6s infinite; }
    .pulse { fill:#67e8f9; filter:url(#glow); animation: run 6s cubic-bezier(.45,.05,.55,.95) infinite; }
    .meter { fill:#0f0b2e; stroke:#67e8f9; stroke-width:1.4; animation: meas 6s infinite; }
    .bit  { fill:#67e8f9; font-size:12px; text-anchor:middle; opacity:0; animation: bit 6s infinite; }
    .vec  { transform-origin: 835px 168px; animation: precess 9s linear infinite; }
    .fade { animation: fadein 1.2s ease-out backwards; }
    .d1 { animation-delay:.15s } .d2 { animation-delay:.45s } .d3 { animation-delay:.75s }
    .g1 { animation-delay: .6s } .g2 { animation-delay:1.3s } .g3 { animation-delay:2s }
    .g4 { animation-delay:2.5s } .g5 { animation-delay:3s } .g6 { animation-delay:3.6s }
    .p1 { animation-delay:0s } .p2 { animation-delay:.12s } .p3 { animation-delay:.24s } .p4 { animation-delay:.36s }

    @keyframes run    { 0% { transform:translateX(0); opacity:0 } 6% { opacity:1 } 70% { transform:translateX(468px); opacity:1 } 78%,100% { transform:translateX(468px); opacity:0 } }
    @keyframes gate   { 0%,100% { fill:#1b1446 } 8% { fill:#6d28d9 } 22% { fill:#1b1446 } }
    @keyframes meas   { 0%,68% { fill:#0f0b2e } 74% { fill:#155e75 } 90%,100% { fill:#0f0b2e } }
    @keyframes bit    { 0%,72% { opacity:0 } 76%,92% { opacity:1 } 100% { opacity:0 } }
    @keyframes precess{ 0% { transform:rotate(-38deg) } 50% { transform:rotate(38deg) } 100% { transform:rotate(-38deg) } }
    @keyframes fadein { from { opacity:0 } to { opacity:1 } }
    @keyframes blink  { 50% { opacity:0 } }
    .cursor { animation: blink 1s steps(1) infinite; }
  </style>

  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="18" fill="url(#dots)"/>

  <!-- Title -->
  <text x="44" y="70" class="sans fade d1" font-size="44" font-weight="800" fill="url(#title)" letter-spacing="-0.5">Abdullah Mahmood</text>
  <text x="46" y="100" class="mono fade d2" font-size="14" fill="#b8b0e8">software engineer · quantum ML researcher · educator<tspan class="cursor" fill="#67e8f9"> ▍</tspan></text>

  <!-- decorative circuit -->
  <g class="mono fade d3">
    <g font-size="12" fill="#8f86c9">
      <text x="44" y="152">|0⟩</text><text x="44" y="187">|0⟩</text>
      <text x="44" y="222">|0⟩</text><text x="44" y="257">|0⟩</text>
    </g>
    <line class="wire" x1="76" y1="148" x2="600" y2="148"/>
    <line class="wire" x1="76" y1="183" x2="600" y2="183"/>
    <line class="wire" x1="76" y1="218" x2="600" y2="218"/>
    <line class="wire" x1="76" y1="253" x2="600" y2="253"/>

    <!-- H layer -->
    <g><rect class="gate g1" x="98" y="135" width="28" height="26" rx="5"/><text class="gl" x="112" y="148">H</text></g>
    <g><rect class="gate g1" x="98" y="170" width="28" height="26" rx="5"/><text class="gl" x="112" y="183">H</text></g>
    <g><rect class="gate g1" x="98" y="205" width="28" height="26" rx="5"/><text class="gl" x="112" y="218">H</text></g>
    <g><rect class="gate g1" x="98" y="240" width="28" height="26" rx="5"/><text class="gl" x="112" y="253">H</text></g>

    <!-- Feature encoding RY(x) -->
    <g><rect class="gate g2" x="152" y="135" width="46" height="26" rx="5"/><text class="gl" x="175" y="148">RY(x)</text></g>
    <g><rect class="gate g2" x="152" y="170" width="46" height="26" rx="5"/><text class="gl" x="175" y="183">RY(x)</text></g>
    <g><rect class="gate g2" x="152" y="205" width="46" height="26" rx="5"/><text class="gl" x="175" y="218">RY(x)</text></g>
    <g><rect class="gate g2" x="152" y="240" width="46" height="26" rx="5"/><text class="gl" x="175" y="253">RY(x)</text></g>

    <!-- Entangling CNOT ladder -->
    <g stroke="#a78bfa" stroke-width="1.6" fill="none">
      <line x1="236" y1="148" x2="236" y2="183"/><circle cx="236" cy="183" r="8"/><line x1="228" y1="183" x2="244" y2="183"/>
      <line x1="274" y1="183" x2="274" y2="218"/><circle cx="274" cy="218" r="8"/><line x1="266" y1="218" x2="282" y2="218"/>
      <line x1="312" y1="218" x2="312" y2="253"/><circle cx="312" cy="253" r="8"/><line x1="304" y1="253" x2="320" y2="253"/>
    </g>
    <circle class="ctrl g3" cx="236" cy="148" r="4.5"/>
    <circle class="ctrl g4" cx="274" cy="183" r="4.5"/>
    <circle class="ctrl g4" cx="312" cy="218" r="4.5"/>

    <!-- Trainable rotations Rot(θ) -->
    <g><rect class="gate g5" x="350" y="135" width="52" height="26" rx="5"/><text class="gl" x="376" y="148">Rot(θ)</text></g>
    <g><rect class="gate g5" x="350" y="170" width="52" height="26" rx="5"/><text class="gl" x="376" y="183">Rot(θ)</text></g>
    <g><rect class="gate g5" x="350" y="205" width="52" height="26" rx="5"/><text class="gl" x="376" y="218">Rot(θ)</text></g>
    <g><rect class="gate g5" x="350" y="240" width="52" height="26" rx="5"/><text class="gl" x="376" y="253">Rot(θ)</text></g>

    <!-- Ring closure CNOT q3 -> q0 -->
    <g stroke="#a78bfa" stroke-width="1.6" fill="none">
      <line x1="440" y1="148" x2="440" y2="253"/><circle cx="440" cy="148" r="8"/><line x1="432" y1="148" x2="448" y2="148"/>
    </g>
    <circle class="ctrl g6" cx="440" cy="253" r="4.5"/>

    <!-- Measurement on q0 -->
    <g>
      <rect class="meter" x="476" y="133" width="44" height="30" rx="5"/>
      <path d="M484 156 A14 14 0 0 1 512 156" fill="none" stroke="#67e8f9" stroke-width="1.4"/>
      <line x1="498" y1="156" x2="508" y2="140" stroke="#67e8f9" stroke-width="1.4"/>
      <text class="bit mono" x="560" y="152">|ψ⟩</text>
    </g>

    <!-- Travelling amplitude pulses -->
    <circle class="pulse p1" cx="80" cy="148" r="3.5"/>
    <circle class="pulse p2" cx="80" cy="183" r="3.5"/>
    <circle class="pulse p3" cx="80" cy="218" r="3.5"/>
    <circle class="pulse p4" cx="80" cy="253" r="3.5"/>
  </g>

  <!-- Bloch sphere -->
  <g class="fade d3">
    <circle cx="835" cy="168" r="100" fill="url(#sphere)" stroke="#a78bfa" stroke-width="1.4"/>
    <ellipse cx="835" cy="168" rx="100" ry="28" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".55"/>
    <ellipse cx="835" cy="168" rx="100" ry="28" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".35" stroke-dasharray="4 5" transform="rotate(90 835 168)"/>
    <line x1="835" y1="58" x2="835" y2="278" stroke="#8f86c9" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="835" y="50" class="mono" font-size="14" fill="#e9e5ff" text-anchor="middle">|0⟩</text>
    <text x="835" y="298" class="mono" font-size="14" fill="#e9e5ff" text-anchor="middle">|1⟩</text>
    <text x="944" y="172" class="mono" font-size="12" fill="#8f86c9">|+⟩</text>
    <g class="vec">
      <line x1="835" y1="168" x2="835" y2="88" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="835" cy="86" r="6" fill="#67e8f9" filter="url(#glow)"/>
      <text x="846" y="92" class="mono" font-size="14" fill="#67e8f9" font-weight="700">ψ</text>
    </g>
    <circle cx="835" cy="168" r="3" fill="#e9e5ff"/>
  </g>

  <text x="44" y="296" class="mono fade d3" font-size="12" fill="#8f86c9">C# · .NET · Angular in production  ·  PennyLane in research  ·  NED → INTI Malaysia</text>
</svg>

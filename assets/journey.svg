@keyframes flow{from{transform:translateX(0)}to{transform:translateX(900px)}}
.ln{stroke-dasharray:900;animation:draw 2.6s ease-out backwards}
.n{animation:pop .6s ease-out backwards}
.f{animation:flow 5s linear infinite}
</style>
